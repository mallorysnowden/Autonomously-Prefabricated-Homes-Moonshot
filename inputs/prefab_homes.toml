# --- Site system (base case): self-leveling foundation + forklift-set components --------
# Overrides the conventional site, final-stage and transport/set inputs above when enabled.
# The breakthrough claim: forklift-sized pieces that self-level on the foundation and lock
# together tightly enough to need almost no onsite finishing.

[site_system.enabled]
base = 1
unit = "1 = on"
source = "Base case. Set to 0 for conventional site work and crane set."

[site_system.foundation_share]
base = 0.58
unit = "foundation share of site + foundation cost"
source = "NAHB 2024: foundations 10.5% and site work 7.6% of construction cost"

[site_system.foundation_reduction]
base = 0.40
low = 0.15
high = 0.60
unit = "fraction vs poured foundation"
source = "Assumption: factory-made adjustable foundation on helical piles or precast pads, no curing time"

[site_system.sitework_reduction]
base = 0.10
low = 0.0
high = 0.25
unit = "fraction vs conventional site work"
source = "Assumption: less grading for a leveling foundation; utilities and driveway unchanged"

[site_system.set_cost]
base = 0.035
low = 0.02
high = 0.06
unit = "fraction of site-built construction cost"
source = "Assumption: forklift or telehandler set instead of a crane; conventional modular is 0.06 above"

[site_system.final_reduction]
base = 0.30
low = 0.10
high = 0.45
unit = "fraction vs conventional final stage"
source = "Assumption: plug-in plumbing and electrical couplings and pre-finished joints"

[site_system.learning_rate]
base = 0.10
low = 0.05
high = 0.15
unit = "per doubling, for site and final stage"
source = "Assumption: new hardware learns like MEP and finishes (0.10), not like conventional site work (0.03)"

[site_system.our_months]
base = 3.5
low = 2.5
high = 5.0
unit = "months from permit to occupancy"
source = "Target. Includes ~1.4 months permit to start (Census 2025)."

[site_system.joint_tolerance_mm]
base = 3.0
low = 1.5
high = 6.0
unit = "mm, assembled joint tolerance achieved"
source = "Target to prove in a prototype (no data yet)"

[site_system.tolerance_needed_mm]
base = 3.0
unit = "mm, tolerance at which joints need no finishing rework"
source = "Assumption: about 1/8 inch, finish-carpentry level"

