# Automated factories for electrified prefab homes: TEA inputs
#
# A network of robotic "microfactories" building all-electric homes with
# factory-installed solar and batteries. Costs are per square foot and are
# benchmarked to the NAHB 2024 site-built cost; unit costs are at NOAK and fall
# from FOAK by learning on cumulative homes built. Fractions are decimals.
# "Assumption" = judgment, not sourced.

[meta]
project = "Automated factories for electrified prefab homes"
boundary = "Design, factory build, transport, set and finish a single-family home, plus energy and service add-ons. Excludes land and lot development."
functional_units = "Installed price per sq ft excluding land; months from permit to occupancy; buyer's cost of waiting; owner's annual cost of home plus energy."

# --- Home and benchmarks -----------------------------------------------------

[home.sqft]
base = 1800
low = 1200
high = 2400
unit = "sq ft per home"
source = "Assumption. Modular homes average ~1,900 sq ft vs ~2,400 site-built (Census, via Floor Trends)."

[bench.site_built_cost_per_sqft]
base = 162
unit = "$/sq ft construction cost"
source = "NAHB 2024 Cost of Constructing a Home: $428,215 for 2,647 sq ft"

[bench.site_built_price_per_sqft]
base = 217
unit = "$/sq ft price excluding land"
source = "NAHB 2024: $665,298 average price less 13.7% finished lot, over 2,647 sq ft"

[bench.modular_discount]
base = 0.15
low = 0.10
high = 0.20
unit = "fraction below site-built price"
source = "Modular is commonly quoted 10-20% below site-built per sq ft; Census permit values ~19% lower"

[bench.manufactured_price_per_sqft]
base = 87
unit = "$/sq ft"
source = "Manufactured Housing Institute: $87/sq ft (HUD-code homes, a different product)"

[bench.site_built_months]
base = 8.8
unit = "months, permit to completion"
source = "Census Survey of Construction 2025 via NAHB: 1.4 months authorization to start + 7.4 to finish"

[bench.modular_months_saved]
base = 1.9
unit = "months"
source = "Census: modular averages 5.0 months start to completion vs 6.9 for site-built"

[time.our_months]
base = 4.5
low = 3.0
high = 7.0
unit = "months, permit to occupancy"
source = "Target. Reframe Systems claims 3x faster than conventional (company-reported)."

# --- Pricing ----------------------------------------------------------------

[price.discount_vs_modular]
base = 0.05
low = 0.0
high = 0.15
unit = "fraction below conventional modular price"
source = "Assumption: must be cost-competitive with conventional prefab"

# --- Cost structure: share of site-built construction cost by component -----
# Site work 7.6% and foundations 10.5% (NAHB 2024) stay on site; the rest is split by assumption.

[cost.share_structure]
base = 0.30
unit = "fraction (framing, roof, envelope)"
source = "NAHB 2024: framing 16.6%; exterior finishes added by assumption"

[cost.share_mep]
base = 0.18
unit = "fraction (mechanical, electrical, plumbing rough-ins)"
source = "Assumption based on NAHB stage shares"

[cost.share_finishes]
base = 0.27
unit = "fraction (interior finishes)"
source = "Assumption based on NAHB stage shares"

[cost.share_site]
base = 0.18
unit = "fraction (site work and foundation)"
source = "NAHB 2024: site work 7.6% + foundations 10.5%"

[cost.share_final]
base = 0.07
unit = "fraction (final steps, landscaping, other)"
source = "Assumption"

[cost.transport_set]
base = 0.06
low = 0.03
high = 0.10
unit = "added cost, fraction of site-built construction cost"
source = "Assumption: trucking, crane and set, which site-built homes don't pay"

# NOAK cost reduction vs site-built construction cost, by component
[cost.noak_reduction_structure]
base = 0.35
low = 0.20
high = 0.50
unit = "fraction"
source = "Target: robotic framing and envelope. Reframe claims 35% lower total cost (company-reported)."

[cost.noak_reduction_mep]
base = 0.25
low = 0.10
high = 0.40
unit = "fraction"
source = "Target: prefabricated wiring and plumbing assemblies; the hardest part to automate"

[cost.noak_reduction_finishes]
base = 0.20
low = 0.05
high = 0.35
unit = "fraction"
source = "Target"

[cost.noak_reduction_site]
base = 0.05
low = 0.0
high = 0.15
unit = "fraction"
source = "Target: standardized foundations"

[cost.noak_reduction_final]
base = 0.10
low = 0.0
high = 0.20
unit = "fraction"
source = "Target"

