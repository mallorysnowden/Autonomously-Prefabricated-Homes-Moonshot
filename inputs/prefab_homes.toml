# --- Factories ----------------------------------------------------------------

[factory.capex]
base = 10_000_000
low = 5_000_000
high = 50_000_000
unit = "$ per factory"
source = "Reframe: <$5M of equipment for 250 homes/yr (claimed); Vantem ~$20M per factory; ground-up modular plants $40-60M (Offsite Builder)"

[factory.capacity]
base = 250
low = 150
high = 500
unit = "homes/yr per factory at full output"
source = "Reframe FAB1 design capacity: 250 single-family homes/yr (not yet operating)"

[factory.utilization]
base = 0.80
low = 0.60
high = 0.95
unit = "fraction after first year"
source = "Assumption. 92% of modular factories report excess capacity (industry survey), so demand, not capacity, binds."

[factory.first_year_utilization]
base = 0.40
unit = "fraction in a factory's first year"
source = "Assumption"

[factory.fixed_opex]
base = 3_000_000
low = 2_000_000
high = 6_000_000
unit = "$/yr per factory"
source = "Assumption: salaried staff, lease, maintenance (direct labor is in component costs)"

[factory.life]
base = 15
unit = "yr"
source = "Assumption"

[factory.schedule]
base = [1, 2, 4, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33]
unit = "factories operating, by commercial year (last value holds)"
source = "Assumption"

[market.single_family_completions]
base = 1_000_000
unit = "homes/yr"
source = "Census via NAHB: 975,000-1,005,000 single-family completions in 2025"

[market.max_share]
base = 0.02
low = 0.01
high = 0.05
unit = "cap on our share of single-family completions"
source = "Assumption. All modular + panelized was 3% in 2025 (7% in 1998)."

